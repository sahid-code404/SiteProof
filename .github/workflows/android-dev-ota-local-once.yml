name: Android Dev OTA Local Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-dev-ota-local-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: siteproof-dev-ota-local-once
  cancel-in-progress: true

jobs:
  publish-local-dev-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve monotonic OTA version
        id: version
        shell: bash
        run: |
          CURRENT_CODE="$(curl -fsSL https://github.com/sahid-code404/SiteProof/releases/download/dev-latest/siteproof-update.json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])' 2>/dev/null || true)"
          if ! [[ "$CURRENT_CODE" =~ ^[0-9]+$ ]]; then
            CURRENT_CODE=5000
          fi
          VERSION_CODE=$((CURRENT_CODE + 1))
          VERSION_NAME="0.5.local.${GITHUB_RUN_NUMBER}"
          API_BASE_URL="http://192.168.1.102:8000/api/v1/"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "api=$API_BASE_URL" >> "$GITHUB_OUTPUT"
          echo "Publishing local dev OTA versionCode=$VERSION_CODE to $API_BASE_URL"

      - name: Test and build stable-signed debug APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace \
            -PSITEPROOF_API_BASE_URL="${{ steps.version.outputs.api }}" \
            -PSITEPROOF_VERSION_CODE="${{ steps.version.outputs.code }}" \
            -PSITEPROOF_VERSION_NAME="${{ steps.version.outputs.name }}"

      - name: Prepare verified OTA package
        id: package
        shell: bash
        run: |
          mkdir -p ../ota
          cp app/build/outputs/apk/debug/app-debug.apk ../ota/SiteProof-debug.apk
          SHA256=$(sha256sum ../ota/SiteProof-debug.apk | awk '{print $1}')
          cat > ../ota/siteproof-update.json <<JSON
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkUrl": "https://github.com/sahid-code404/SiteProof/releases/download/dev-latest/SiteProof-debug.apk",
            "sha256": "$SHA256",
            "notes": "Challenge voice guidance fix: audible rotate, tilt, correction and hold instructions."
          }
          JSON
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: siteproof-local-ota-${{ steps.version.outputs.code }}
          path: |
            ota/SiteProof-debug.apk
            ota/siteproof-update.json
          retention-days: 7

      - name: Publish dev-latest OTA
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="Local SiteProof dev OTA with challenge voice guidance fix. SHA-256: ${{ steps.package.outputs.sha256 }}"
          if gh release view dev-latest >/dev/null 2>&1; then
            git tag -f dev-latest "$GITHUB_SHA"
            git push origin refs/tags/dev-latest --force
            gh release upload dev-latest \
              ota/SiteProof-debug.apk \
              ota/siteproof-update.json \
              --clobber
            gh release edit dev-latest \
              --title "SiteProof Local Update ${{ steps.version.outputs.name }}" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release create dev-latest \
              ota/SiteProof-debug.apk \
              ota/siteproof-update.json \
              --target "$GITHUB_SHA" \
              --title "SiteProof Local Update ${{ steps.version.outputs.name }}" \
              --prerelease \
              --notes "$NOTES"
          fi
