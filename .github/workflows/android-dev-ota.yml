name: Android Dev OTA

on:
  push:
    branches:
      - main
      - phase5-visual-motion
      - phase9-advanced-security
      - phase10-environment-anomaly
      - phase11-final-polish
    paths:
      - 'android/**'
      - '.github/workflows/android-dev-ota.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: siteproof-dev-ota
  cancel-in-progress: true

jobs:
  publish-dev-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve update version and API
        id: version
        shell: bash
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.5.${GITHUB_RUN_NUMBER}"
          API_BASE_URL="${{ vars.SITEPROOF_DEV_API_BASE_URL }}"
          if [ -z "$API_BASE_URL" ]; then
            echo "SITEPROOF_DEV_API_BASE_URL repository variable is required for OTA builds." >&2
            exit 1
          fi
          case "$API_BASE_URL" in
            http://*|https://*) ;;
            *) echo "SITEPROOF_DEV_API_BASE_URL must be an absolute http(s) URL." >&2; exit 1 ;;
          esac
          case "$API_BASE_URL" in
            */) ;;
            *) API_BASE_URL="${API_BASE_URL}/" ;;
          esac
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "api=$API_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Test and build stable-signed debug APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace \
            -PSITEPROOF_API_BASE_URL="${{ steps.version.outputs.api }}" \
            -PSITEPROOF_VERSION_CODE="${{ steps.version.outputs.code }}" \
            -PSITEPROOF_VERSION_NAME="${{ steps.version.outputs.name }}"

      - name: Prepare verified OTA package
        id: package
        shell: bash
        run: |
          mkdir -p ../ota
          cp app/build/outputs/apk/debug/app-debug.apk ../ota/SiteProof-debug.apk
          SHA256=$(sha256sum ../ota/SiteProof-debug.apk | awk '{print $1}')
          cat > ../ota/siteproof-update.json <<JSON
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkUrl": "https://github.com/sahid-code404/SiteProof/releases/download/dev-latest/SiteProof-debug.apk",
            "sha256": "$SHA256",
            "notes": "Authoritative capture duration, conservative GPS accuracy, encoded-time countdown, upload progress and storage safeguards."
          }
          JSON
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: siteproof-dev-ota-${{ steps.version.outputs.code }}
          path: |
            ota/SiteProof-debug.apk
            ota/siteproof-update.json
          retention-days: 30

      - name: Publish stable dev-latest release without delete gap
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="OTA build for the SiteProof development package. SHA-256: ${{ steps.package.outputs.sha256 }}"
          if gh release view dev-latest >/dev/null 2>&1; then
            git tag -f dev-latest "$GITHUB_SHA"
            git push origin refs/tags/dev-latest --force
            gh release upload dev-latest \
              ota/SiteProof-debug.apk \
              ota/siteproof-update.json \
              --clobber
            gh release edit dev-latest \
              --title "SiteProof Update ${{ steps.version.outputs.name }}" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release create dev-latest \
              ota/SiteProof-debug.apk \
              ota/siteproof-update.json \
              --target "$GITHUB_SHA" \
              --title "SiteProof Update ${{ steps.version.outputs.name }}" \
              --prerelease \
              --notes "$NOTES"
          fi
