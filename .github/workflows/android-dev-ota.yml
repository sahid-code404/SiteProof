name: Android Dev OTA

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-dev-ota.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: siteproof-dev-ota
  cancel-in-progress: true

jobs:
  publish-dev-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve monotonic update version
        id: version
        shell: bash
        run: |
          RUN_CODE=$((5000 + GITHUB_RUN_NUMBER))
          CURRENT_CODE="$(curl -fsSL \
            "https://github.com/sahid-code404/SiteProof/releases/download/dev-latest/siteproof-update.json?run=${GITHUB_RUN_ID}" \
            2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])' \
            2>/dev/null || true)"
          if [[ "$CURRENT_CODE" =~ ^[0-9]+$ ]] && [ "$CURRENT_CODE" -ge "$RUN_CODE" ]; then
            VERSION_CODE=$((CURRENT_CODE + 1))
          else
            VERSION_CODE=$RUN_CODE
          fi
          VERSION_NAME="0.5.${GITHUB_RUN_NUMBER}"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Publishing OTA versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Test and build stable-signed debug APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace \
            -PSITEPROOF_VERSION_CODE="${{ steps.version.outputs.code }}" \
            -PSITEPROOF_VERSION_NAME="${{ steps.version.outputs.name }}"

      - name: Prepare verified OTA package
        id: package
        shell: bash
        run: |
          mkdir -p ../ota
          cp app/build/outputs/apk/debug/app-debug.apk ../ota/SiteProof-debug.apk
          SHA256=$(sha256sum ../ota/SiteProof-debug.apk | awk '{print $1}')
          cat > ../ota/siteproof-update.json <<JSON
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkUrl": "https://github.com/sahid-code404/SiteProof/releases/download/dev-latest/SiteProof-debug.apk",
            "sha256": "$SHA256",
            "notes": "Automatic local backend discovery and reliable challenge voice guidance."
          }
          JSON
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: siteproof-dev-ota-${{ steps.version.outputs.code }}
          path: |
            ota/SiteProof-debug.apk
            ota/siteproof-update.json
          retention-days: 30

      - name: Publish stable dev-latest release without delete gap
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="Automatic SiteProof dev OTA. SHA-256: ${{ steps.package.outputs.sha256 }}"
          if gh release view dev-latest >/dev/null 2>&1; then
            git tag -f dev-latest "$GITHUB_SHA"
            git push origin refs/tags/dev-latest --force
            gh release upload dev-latest \
              ota/SiteProof-debug.apk \
              ota/siteproof-update.json \
              --clobber
            gh release edit dev-latest \
              --title "SiteProof Update ${{ steps.version.outputs.name }}" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release create dev-latest \
              ota/SiteProof-debug.apk \
              ota/siteproof-update.json \
              --target "$GITHUB_SHA" \
              --title "SiteProof Update ${{ steps.version.outputs.name }}" \
              --prerelease \
              --notes "$NOTES"
          fi
