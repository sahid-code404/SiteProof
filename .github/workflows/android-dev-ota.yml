name: Android Inspector Branch OTA

on:
  push:
    branches:
      - feature/android-inspector-management
    paths:
      - 'android/**'
      - '.github/workflows/android-dev-ota.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: siteproof-inspector-ota
  cancel-in-progress: true

jobs:
  publish-inspector-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve monotonic update version
        id: version
        shell: bash
        run: |
          RUN_CODE=$((5000 + GITHUB_RUN_NUMBER))
          BRANCH_CODE="$(curl -fsSL \
            "https://github.com/sahid-code404/SiteProof/releases/download/inspector-latest/siteproof-update.json?run=${GITHUB_RUN_ID}" \
            2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])' \
            2>/dev/null || true)"
          MAIN_CODE="$(curl -fsSL \
            "https://github.com/sahid-code404/SiteProof/releases/download/dev-latest/siteproof-update.json?run=${GITHUB_RUN_ID}" \
            2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])' \
            2>/dev/null || true)"

          VERSION_CODE=$RUN_CODE
          for CURRENT_CODE in "$BRANCH_CODE" "$MAIN_CODE"; do
            if [[ "$CURRENT_CODE" =~ ^[0-9]+$ ]] && [ "$CURRENT_CODE" -ge "$VERSION_CODE" ]; then
              VERSION_CODE=$((CURRENT_CODE + 1))
            fi
          done

          VERSION_NAME="0.5.${GITHUB_RUN_NUMBER}-inspector"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Publishing inspector OTA versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Test and build stable-signed branch APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace \
            -PSITEPROOF_VERSION_CODE="${{ steps.version.outputs.code }}" \
            -PSITEPROOF_VERSION_NAME="${{ steps.version.outputs.name }}" \
            -PSITEPROOF_UPDATE_MANIFEST_URL="https://github.com/sahid-code404/SiteProof/releases/download/inspector-latest/siteproof-update.json"

      - name: Prepare verified OTA package
        id: package
        shell: bash
        run: |
          mkdir -p ../ota
          cp app/build/outputs/apk/debug/app-debug.apk ../ota/SiteProof-debug.apk
          SHA256=$(sha256sum ../ota/SiteProof-debug.apk | awk '{print $1}')
          cat > ../ota/siteproof-update.json <<JSON
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkUrl": "https://github.com/sahid-code404/SiteProof/releases/download/inspector-latest/SiteProof-debug.apk",
            "sha256": "$SHA256",
            "notes": "Inspector branch build with runtime backend IP/URL configuration and automatic local discovery."
          }
          JSON
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: siteproof-inspector-ota-${{ steps.version.outputs.code }}
          path: |
            ota/SiteProof-debug.apk
            ota/siteproof-update.json
          retention-days: 30

      - name: Publish inspector-latest release without touching main OTA
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="SiteProof inspector branch OTA. SHA-256: ${{ steps.package.outputs.sha256 }}"
          if gh release view inspector-latest >/dev/null 2>&1; then
            git tag -f inspector-latest "$GITHUB_SHA"
            git push origin refs/tags/inspector-latest --force
            gh release upload inspector-latest \
              ota/SiteProof-debug.apk \
              ota/siteproof-update.json \
              --clobber
            gh release edit inspector-latest \
              --title "SiteProof Inspector Update ${{ steps.version.outputs.name }}" \
              --prerelease \
              --notes "$NOTES"
          else
            gh release create inspector-latest \
              ota/SiteProof-debug.apk \
              ota/siteproof-update.json \
              --target "$GITHUB_SHA" \
              --title "SiteProof Inspector Update ${{ steps.version.outputs.name }}" \
              --prerelease \
              --notes "$NOTES"
          fi
