name: Android Redesign APK

on:
  push:
    branches:
      - 'redesign/adaptive-glass-ui'
    paths:
      - 'android/**'
      - '.github/workflows/android-redesign-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteproof-redesign-apk
  cancel-in-progress: true

jobs:
  build-redesign-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test and build redesign debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p ../apk
          cp app/build/outputs/apk/debug/app-debug.apk ../apk/SiteProof-redesign-auto-discovery.apk
          sha256sum ../apk/SiteProof-redesign-auto-discovery.apk > ../apk/SiteProof-redesign-auto-discovery.sha256

      - name: Upload redesign APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: siteproof-redesign-auto-discovery
          path: |
            apk/SiteProof-redesign-auto-discovery.apk
            apk/SiteProof-redesign-auto-discovery.sha256
          if-no-files-found: error
          retention-days: 30
