name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: siteproof_test
          POSTGRES_USER: siteproof
          POSTGRES_PASSWORD: siteproof_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siteproof -d siteproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://siteproof:siteproof_test_password@localhost:5432/siteproof_test
      SITEPROOF_TEST_DATABASE_URL: postgresql+psycopg://siteproof:siteproof_test_password@localhost:5432/siteproof_test
      JWT_SECRET: ci-only-siteproof-secret-key-at-least-32-bytes
      ENVIRONMENT: test
      RECEIPT_SIGNING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Verify fresh migration
        run: alembic upgrade head
      - name: Verify Phase 10 downgrade and re-upgrade
        run: |
          alembic downgrade 0009_phase9_advanced_security
          alembic upgrade head
      - run: ruff check app tests alembic
      - run: pytest -q

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend image
        run: docker build -t siteproof-backend-ci ./backend
      - name: Smoke test production-only imports
        run: >-
          docker run --rm siteproof-backend-ci
          python -c "import app.main; import app.services.autonomous_ai_client; import app.services.autonomous_verification_service; print('production backend imports ok')"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload redesign debug APK
        uses: actions/upload-artifact@v4
        with:
          name: siteproof-redesign-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
