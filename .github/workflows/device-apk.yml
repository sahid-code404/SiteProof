name: Phase 5 Device APK

on:
  push:
    branches:
      - build/phase5-device-apk-192-168-1-102

jobs:
  android-device-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Phase 5 device APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug -PSITEPROOF_API_BASE_URL=http://192.168.1.102:8000/api/v1/ --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: siteproof-phase5-192-168-1-102
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Trigger build after workflow registration.
